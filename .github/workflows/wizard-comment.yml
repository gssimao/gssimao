name: Update Wizard Visitor Comment

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-wizard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask the wizard for his mood
        run: python scripts/update_wizard_comment.py

      - name: Commit and push if the comment changed
        run: |
          git config user.name "wizard-bot"
          git config user.email "actions@github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "The wizard checks the crowd"
            git push
          else
            echo "No change in the wizard's mood."
          fi
